name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  build-optimized:
    name: Build with production settings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # The hook's CREATE2 address is mined over bytecode produced by the
      # `optimized` profile. Keeping this green means the profile that will be
      # deployed always compiles, not just the fast dev profile.
      - name: Build (optimized)
        run: FOUNDRY_PROFILE=optimized forge build --sizes

  slither:
    name: Slither
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    # Kessel holds the `beforeSwapReturnDelta` permission, which is the highest
    # risk surface in v4. Static analysis is not optional here.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts
          fail-on: medium
          slither-config: contracts/slither.config.json
